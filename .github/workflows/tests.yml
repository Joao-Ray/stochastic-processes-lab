name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Execute supplementary experiments
        env:
          MPLBACKEND: Agg
        run: python scripts/execute_notebooks.py notebooks/06_supplementary_validation.ipynb

      - name: Reproduce OU calibration subproject
        env:
          MPLBACKEND: Agg
        run: python subprojects/ou-calibration/run.py --output /tmp/ou-calibration-results

      - name: Verify OU theoretical results
        env:
          MPLBACKEND: Agg
        run: python subprojects/ou-calibration/verify.py --output /tmp/ou-verification

      - name: Reproduce OU uncertainty benchmark
        env:
          MPLBACKEND: Agg
        run: python subprojects/ou-inference-study/run.py --output /tmp/ou-uncertainty

      - name: Reproduce independent OU confirmation
        env:
          MPLBACKEND: Agg
        run: python subprojects/ou-inference-study/run.py --config subprojects/ou-inference-study/confirmation.json --output /tmp/ou-confirmation
